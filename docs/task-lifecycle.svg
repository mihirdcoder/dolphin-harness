<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 654" role="img" aria-labelledby="title desc">
<title id="title">How the harness routes and delivers work</title>
<desc id="desc">Route each task. Questions preserve the parent task. Material changes return to planning. Feature delivery moves from scope and design to tests, implementation, verification and closeout. Closeout refreshes capability context. Later iterations use new change records. Recurring process gaps lead to approved and tested workflow updates.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#62778c"/></marker>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #182d42 }
    .title { font-size: 29px; font-weight: 700 }
    .label { font-size: 14px; font-weight: 700; letter-spacing: 1.25px; fill: #32645b }
    .heading { font-size: 20px; font-weight: 700 }
    .body { font-size: 17px; fill: #3a5066 }
    .note { font-size: 16px; fill: #3a5066 }
    .arrow { fill: none; stroke: #62778c; stroke-width: 2; marker-end: url(#arrow) }
  </style>
</defs>
<rect width="1160" height="654" rx="20" fill="#f3f7fa"/>

<text x="30" y="47" class="title">How the harness routes and delivers work</text>
<text x="30" y="82" class="label">TASK ROUTING</text>
<rect x="30" y="98" width="320" height="92" rx="12" fill="#e3f3eb" stroke="#a3cbbb"/>
<text x="46" y="127" class="heading">Route the request</text>
<text x="46" y="153" class="body">Identify intent, scope, and authority.</text>
<text x="46" y="175" class="body">Load the rules and sources it needs.</text>
<path class="arrow" d="M356 144L381 144"/>
<rect x="388" y="98" width="351" height="92" rx="12" fill="#ffffff" stroke="#c7d5e1"/>
<text x="404" y="127" class="heading">Choose the smallest workflow</text>
<text x="404" y="153" class="body">Question, investigation, bounded fix,</text>
<text x="404" y="175" class="body">planning, or feature delivery.</text>
<path class="arrow" d="M745 144L770 144"/>
<rect x="777" y="98" width="353" height="92" rx="12" fill="#ffffff" stroke="#c7d5e1"/>
<text x="793" y="127" class="heading">Handle new information</text>
<text x="793" y="153" class="body">Side question → keep the parent task.</text>
<text x="793" y="175" class="body">Material scope change → revisit planning.</text>
<text x="30" y="233" class="label">FEATURE DELIVERY WHEN SCOPE IS SETTLED AND IMPLEMENTATION IS AUTHORIZED</text>
<rect x="30" y="249" width="249" height="112" rx="12" fill="#ffffff" stroke="#c7d5e1"/>
<text x="46" y="278" class="heading">1. Scope and plan</text>
<text x="46" y="304" class="body">Record exclusions and</text>
<text x="46" y="326" class="body">acceptance. Review the</text>
<text x="46" y="348" class="body">plan against current code.</text>
<path class="arrow" d="M285 305L307 305"/>
<rect x="314" y="249" width="249" height="112" rx="12" fill="#ffffff" stroke="#c7d5e1"/>
<text x="330" y="278" class="heading">2. Contracts and tests</text>
<text x="330" y="304" class="body">Review contracts if written.</text>
<text x="330" y="326" class="body">Derive independent tests</text>
<text x="330" y="348" class="body">where applicable.</text>
<path class="arrow" d="M569 305L591 305"/>
<rect x="598" y="249" width="249" height="112" rx="12" fill="#ffffff" stroke="#c7d5e1"/>
<text x="614" y="278" class="heading">3. Build and integrate</text>
<text x="614" y="304" class="body">Set scope, rules, and checks.</text>
<text x="614" y="326" class="body">Connect the real parts.</text>
<text x="614" y="348" class="body">Reconcile current guidance.</text>
<path class="arrow" d="M853 305L875 305"/>
<rect x="882" y="249" width="248" height="112" rx="12" fill="#ffffff" stroke="#c7d5e1"/>
<text x="898" y="278" class="heading">4. Verify and close</text>
<text x="898" y="304" class="body">Run independent checks.</text>
<text x="898" y="326" class="body">Record outcomes, open</text>
<text x="898" y="348" class="body">limits, and the next action.</text>
<text x="30" y="393" class="note">The coordinator updates the checkpoint and records meaningful transitions throughout delivery.</text>
<text x="30" y="433" class="label">WHAT THE NEXT TASK INHERITS</text>
<rect x="30" y="449" width="350" height="93" rx="12" fill="#e3f3eb" stroke="#a3cbbb"/>
<text x="46" y="478" class="heading">Current capability context</text>
<text x="46" y="504" class="body">Approved requirements and verified</text>
<text x="46" y="526" class="body">implementation guide the next task.</text>
<path class="arrow" d="M386 495L411 495"/>
<rect x="418" y="449" width="712" height="93" rx="12" fill="#e3f3eb" stroke="#a3cbbb"/>
<text x="434" y="478" class="heading">Next iteration under the same capability</text>
<text x="434" y="504" class="body">Create a new change plan and checkpoint. Assign work from that build plan.</text>
<text x="434" y="526" class="body">Retain prior plans and dated evidence in the capability history.</text>
<rect x="30" y="568" width="1100" height="63" rx="12" fill="#e4edf5" stroke="#c0d1e1"/>
<text x="46" y="592" class="label">WORKFLOW MAINTENANCE</text>
<text x="46" y="615" class="note">Observe a recurring gap  →  find the stage that could catch it  →  approve and update the rule  →  test the route on real work</text>
</svg>
